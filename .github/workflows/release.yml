name: Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/**'

permissions:
  contents: write
  packages: write

# Serializa los runs del flujo: si llega un commit nuevo con un build en curso,
# el anterior se cancela y el nuevo parte del ultimo estado de main. Evita que
# dos runs coincidan en el commit de bump ("rejected: fetch first").
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$ANDROID_HOME/cmdline-tools"/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null 2>&1

      # Regla del proyecto: subir el número de versión en CADA compilación.
      # Incrementa versionCode y el parche de versionName (script: .github/bump_version.py).
      # Si el commit lleva "[no-bump]", se respeta la versión fijada a mano (p. ej. releases 5.0.0).
      #
      # Antes de empujar se re-sincroniza con origin/main y se reintenta hasta 5
      # veces: así dos runs simultáneos no chocan con "rejected: fetch first".
      - name: Bump version (code + name) y commit
        if: "!contains(github.event.head_commit.message, '[no-bump]')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for intento in 1 2 3 4 5; do
            echo "== Intento ${intento}: sincronizando con origin/main =="
            git fetch origin main --quiet
            git reset --hard origin/main

            python3 .github/bump_version.py

            if git diff --quiet app/build.gradle; then
              echo "Sin cambios que subir (la versión ya estaba incrementada)."
              exit 0
            fi

            git add app/build.gradle
            git commit -m "chore(release): bump version [skip ci]" || {
              echo "No changes to commit"
              exit 0
            }

            if git push origin main; then
              echo "Bump de versión subido correctamente."
              exit 0
            fi
            echo "Push rechazado (otro run llegó antes). Reintentando..."
            sleep 2
          done

          echo "ERROR: no se pudo subir el bump de versión tras 5 intentos."
          exit 1

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > signing.keystore
          printf 'storeFile=signing.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK + AAB
        run: chmod +x gradlew && ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          body: "Compilación automática firmada (versionCode/versionName incrementados)."
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

  publish-packages:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$ANDROID_HOME/cmdline-tools"/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null 2>&1

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > signing.keystore
          printf 'storeFile=signing.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish APK to GitHub Packages
        run: chmod +x gradlew && ./gradlew assembleRelease publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

